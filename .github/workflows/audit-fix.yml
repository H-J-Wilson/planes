name: Planes audit fixes

on:
  push:
    branches:
      - v0.0.5-audit-fixes

permissions:
  contents: write

jobs:
  audit-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v0.0.5-audit-fixes
          fetch-depth: 0

      - name: Patch application
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          cat > /tmp/patch_planes.py <<'PY'
          from pathlib import Path
          import ast
          import re
          import subprocess
          import textwrap

          path = Path('webpage.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source)

          def replace_function(src: str, name: str, replacement: str) -> str:
              tree = ast.parse(src)
              target = next((n for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name == name), None)
              if target is None:
                  raise SystemExit(f'Function not found: {name}')
              lines = src.splitlines(keepends=True)
              start = target.lineno - 1
              end = target.end_lineno
              new_lines = replacement.strip('\n') + '\n\n'
              return ''.join(lines[:start]) + new_lines + ''.join(lines[end:])

          settings_fn = '''
def load_settings() -> dict[str, Any]:
    settings = DEFAULT_SETTINGS.copy()
    try:
        raw = json.loads(SETTINGS_FILE.read_text(encoding="utf-8"))
        if isinstance(raw, dict):
            settings.update(raw)
    except (OSError, json.JSONDecodeError, TypeError):
        logger.warning("Unable to read settings.json cleanly; using safe defaults where needed.")

    try:
        settings["aircraft_data_url"] = validate_data_url(str(settings.get("aircraft_data_url", DEFAULT_SETTINGS["aircraft_data_url"])))
    except (ValueError, TypeError):
        settings["aircraft_data_url"] = DEFAULT_SETTINGS["aircraft_data_url"]

    try:
        refresh = int(settings.get("refresh_seconds", DEFAULT_SETTINGS["refresh_seconds"]))
    except (TypeError, ValueError):
        refresh = DEFAULT_SETTINGS["refresh_seconds"]
    settings["refresh_seconds"] = max(2, min(60, refresh))

    settings["asbdb_enabled"] = bool(settings.get("asbdb_enabled", DEFAULT_SETTINGS["asbdb_enabled"]))
    try:
        cache_seconds = int(settings.get("asbdb_cache_seconds", DEFAULT_SETTINGS["asbdb_cache_seconds"]))
    except (TypeError, ValueError):
        cache_seconds = DEFAULT_SETTINGS["asbdb_cache_seconds"]
    settings["asbdb_cache_seconds"] = max(5, min(3600, cache_seconds))
    return settings
'''

          data_fn = '''
LAST_GOOD_DATA: dict[str, Any] = {"aircraft": []}
LAST_GOOD_FETCH_AT: float | None = None


def get_aircraft_data() -> tuple[dict[str, Any], float | None]:
    global LAST_GOOD_DATA, LAST_GOOD_FETCH_AT
    settings = load_settings()
    try:
        url = validate_data_url(str(settings["aircraft_data_url"]))
        started = time.monotonic()
        response = requests.get(url, timeout=2)
        response.raise_for_status()
        data = response.json()
        if not isinstance(data, dict) or not isinstance(data.get("aircraft"), list):
            raise ValueError("Aircraft feed did not return the expected JSON structure.")
        LAST_GOOD_DATA = data
        LAST_GOOD_FETCH_AT = time.time()
        return data, time.monotonic() - started
    except requests.RequestException as exc:
        logger.warning("Aircraft feed request failed: %s", exc)
    except (ValueError, TypeError, json.JSONDecodeError) as exc:
        logger.warning("Aircraft feed returned invalid data: %s", exc)

    # Keep the last known-good aircraft list instead of replacing it with an empty list.
    if LAST_GOOD_DATA.get("aircraft"):
        return LAST_GOOD_DATA, None
    return {"aircraft": []}, None
'''

          dashboard_fn = '''
def dashboard_content() -> str:
    settings = load_settings()
    refresh = settings["refresh_seconds"]
    data, elapsed = get_aircraft_data()
    aircraft = data.get("aircraft", [])
    count = len(aircraft)
    status = "Feed responding" if elapsed is not None else ("Using last good data" if aircraft else "Feed unavailable")
    status_class = "status-ok" if elapsed is not None else ("status-warning" if aircraft else "status-error")
    rows = aircraft_rows(aircraft)
    initial_json = json.dumps(aircraft, separators=(",", ":"), ensure_ascii=True).replace("</", "<\\/")
    return f'''<section class="toolbar" aria-label="Aircraft table controls">
      <div class="search-wrap"><label for="aircraft-search">Search aircraft</label><input id="aircraft-search" type="search" placeholder="Flight, type, registration or hex…" autocomplete="off"></div>
      <div><label for="sort-select">Sort by</label><select id="sort-select"><option value="flight">Flight</option><option value="type">Aircraft</option><option value="speed">Speed</option><option value="altitude">Altitude</option><option value="distance">Distance</option></select></div>
      <button id="refresh-now" class="button secondary" type="button">Refresh now</button>
    </section>
    <section class="filter-bar" aria-label="Aircraft filters">
      <div><label for="aircraft-filter">Show</label><select id="aircraft-filter"><option value="all">All aircraft</option><option value="moving">Moving</option><option value="climbing">Climbing</option><option value="descending">Descending</option><option value="position">Valid position</option><option value="favourite">Favourites</option></select></div>
      <div><label for="min-altitude">Minimum altitude (ft)</label><input id="min-altitude" type="number" min="0" step="100" placeholder="Any"></div>
      <div><label for="min-speed">Minimum speed (kt)</label><input id="min-speed" type="number" min="0" step="5" placeholder="Any"></div>
      <button id="clear-filters" class="button secondary" type="button">Clear filters</button>
    </section>
    <section class="stats-strip" aria-label="Live receiver status">
      <div class="metric"><span>Aircraft</span><strong id="aircraft-count">{count}</strong></div>
      <div class="metric"><span>Feed</span><strong id="feed-status" class="{status_class}">{status}</strong></div>
      <div class="metric"><span>Last check</span><strong id="last-check">Just now</strong></div>
      <div class="metric"><span>Data age</span><strong id="data-age">—</strong></div>
    </section>
    <div id="table-status" class="sr-status" role="status" aria-live="polite"></div>
    <div class="table-card">
      <table id="aircraft-table">
        <caption>Aircraft currently visible to the receiver</caption>
        <thead><tr><th scope="col">Flight</th><th scope="col">Aircraft</th><th scope="col">Speed</th><th scope="col">Altitude</th><th scope="col">More info</th></tr></thead>
        <tbody id="flight-rows">{rows}</tbody>
      </table>
    </div>
    <p class="help-text">Updates automatically every {refresh} seconds. Search and favourites stay on this device.</p>
    <script>
      (() => {{
        const tbody = document.getElementById('flight-rows');
        const count = document.getElementById('aircraft-count');
        const status = document.getElementById('feed-status');
        const last = document.getElementById('last-check');
        const dataAge = document.getElementById('data-age');
        const search = document.getElementById('aircraft-search');
        const sort = document.getElementById('sort-select');
        const filter = document.getElementById('aircraft-filter');
        const minAltitude = document.getElementById('min-altitude');
        const minSpeed = document.getElementById('min-speed');
        const tableStatus = document.getElementById('table-status');
        const REFRESH_SECONDS = {refresh};
        let aircraftData = {initial_json};

        function esc(value) {{
          return String(value ?? '').replace(/[&<>'\"]/g, ch => ({{'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}}[ch]));
        }}
        function favouriteState() {{
          try {{
            const value = JSON.parse(localStorage.getItem('planes-favourites') || '[]');
            return Array.isArray(value) ? value : [];
          }} catch {{ return []; }}
        }}
        function updateFavouriteButtons() {{
          const favs = new Set(favouriteState());
          document.querySelectorAll('[data-favourite]').forEach(btn => {{
            const on = favs.has(btn.dataset.favourite);
            btn.textContent = on ? '★' : '☆';
            btn.setAttribute('aria-pressed', String(on));
          }});
        }}
        function toggleFavourite(key) {{
          if (!key) return;
          const favs = new Set(favouriteState());
          if (favs.has(key)) favs.delete(key); else favs.add(key);
          localStorage.setItem('planes-favourites', JSON.stringify([...favs]));
          renderRows();
        }}
        tbody.addEventListener('click', event => {{
          const button = event.target.closest('[data-favourite]');
          if (button) toggleFavourite(button.dataset.favourite);
        }});

        function renderRows() {{
          const q = search.value.trim().toLowerCase();
          const key = sort.value;
          const hasMinAlt = minAltitude.value.trim() !== '';
          const hasMinSpd = minSpeed.value.trim() !== '';
          const minAlt = Number(minAltitude.value);
          const minSpd = Number(minSpeed.value);
          const favs = new Set(favouriteState());
          const list = [...aircraftData].filter(a => {{
            const text = [a.flight || '', a.t || '', a.desc || '', a.hex || '', a.r || ''].join(' ').toLowerCase();
            const vr = Number(a.baro_rate ?? a.geom_rate);
            const gs = Number(a.gs);
            const alt = Number(a.alt_baro);
            const hasPosition = Number.isFinite(Number(a.lat)) && Number.isFinite(Number(a.lon));
            const matchesFilter = filter.value === 'all'
              || (filter.value === 'moving' && Number.isFinite(gs) && gs > 1)
              || (filter.value === 'climbing' && Number.isFinite(vr) && vr > 100)
              || (filter.value === 'descending' && Number.isFinite(vr) && vr < -100)
              || (filter.value === 'position' && hasPosition)
              || (filter.value === 'favourite' && favs.has(String(a.hex || '').toLowerCase()));
            const altitudeMatches = !hasMinAlt || (Number.isFinite(alt) && alt >= minAlt);
            const speedMatches = !hasMinSpd || (Number.isFinite(gs) && gs >= minSpd);
            return text.includes(q) && altitudeMatches && speedMatches && matchesFilter;
          }});
          list.sort((a,b) => {{
            if (key === 'speed') return Number(b.gs ?? -1) - Number(a.gs ?? -1);
            if (key === 'altitude') return Number(b.alt_baro ?? -1) - Number(a.alt_baro ?? -1);
            if (key === 'type') return String(a.t || a.desc || '').localeCompare(String(b.t || b.desc || ''));
            if (key === 'distance') return Number(b.r_dst ?? -1) - Number(a.r_dst ?? -1);
            return String(a.flight || '').localeCompare(String(b.flight || ''));
          }});
          tbody.innerHTML = list.length ? list.map(a => {{
            const flight = (a.flight || 'Unknown').trim();
            const type = a.t || a.desc || 'Unknown';
            const hex = String(a.hex || '').toLowerCase();
            const favOn = favs.has(hex);
            const details = /^[0-9a-f]{{6}}$/i.test(hex) ? '/aircraft/' + encodeURIComponent(hex) : '#';
            return `<tr data-aircraft-row><td><span class="mobile-label">Flight</span><strong>${{esc(flight)}}</strong></td><td><span class="mobile-label">Aircraft</span>${{esc(type)}}</td><td><span class="mobile-label">Speed</span>${{esc(a.gs ?? '—')}} <span class="unit">kt</span></td><td><span class="mobile-label">Altitude</span>${{esc(a.alt_baro ?? '—')}} <span class="unit">ft</span></td><td class="actions"><button type="button" class="favourite-button" data-favourite="${{esc(hex)}}" aria-label="${{favOn ? 'Remove' : 'Add'}} aircraft to favourites" aria-pressed="${{favOn}}">${{favOn ? '★' : '☆'}}</button> ${{details === '#' ? '' : `<a class="text-link" href="${{details}}">View details</a>`}}</td></tr>`;
          }}).join('') : '<tr><td colspan="5" class="empty-cell">No aircraft match the current filters.</td></tr>';
          updateFavouriteButtons();
        }}

        async function refresh() {{
          try {{
            const res = await fetch('/api/dashboard-data', {{cache:'no-store'}});
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const payload = await res.json();
            if (!Array.isArray(payload.aircraft)) throw new Error('Invalid aircraft payload');
            const feedOk = payload.feed_ok !== false;
            aircraftData = payload.aircraft;
            count.textContent = aircraftData.length;
            status.textContent = feedOk ? 'Feed responding' : (aircraftData.length ? 'Using last good data' : 'Feed unavailable');
            status.className = feedOk ? 'status-ok' : (aircraftData.length ? 'status-warning' : 'status-error');
            last.textContent = new Date().toLocaleTimeString();
            if (typeof payload.now === 'number') {{
              const age = Math.max(0, (Date.now() / 1000) - payload.now);
              dataAge.textContent = age < 2 ? '<2s' : Math.round(age) + 's';
            }} else dataAge.textContent = '—';
            renderRows();
            tableStatus.textContent = feedOk ? 'Aircraft list updated.' : 'Feed unavailable; showing the last successful aircraft data.';
          }} catch (error) {{
            status.textContent = aircraftData.length ? 'Using last good data' : 'Feed unavailable';
            status.className = aircraftData.length ? 'status-warning' : 'status-error';
            last.textContent = 'Connection failed';
            tableStatus.textContent = aircraftData.length ? 'Unable to refresh; keeping the last successful aircraft data.' : 'Unable to load aircraft data.';
          }}
        }}

        search.addEventListener('input', renderRows);
        sort.addEventListener('change', renderRows);
        filter.addEventListener('change', renderRows);
        minAltitude.addEventListener('input', renderRows);
        minSpeed.addEventListener('input', renderRows);
        document.getElementById('clear-filters').addEventListener('click', () => {{ search.value=''; sort.value='flight'; filter.value='all'; minAltitude.value=''; minSpeed.value=''; renderRows(); }});
        document.getElementById('refresh-now').addEventListener('click', refresh);
        renderRows();
        refresh();
        setInterval(refresh, REFRESH_SECONDS * 1000);
      }})();
    </script>'''
'''

          source = replace_function(source, 'load_settings', settings_fn)
          source = replace_function(source, 'get_aircraft_data', data_fn)
          source = replace_function(source, 'dashboard_content', dashboard_fn)

          # Harden the existing aircraft detail helper if present.
          if 'def detail_fragment' in source:
              detail_fn = '''
def detail_fragment(hex_code: str) -> str:
    hex_code = hex_code.strip().lower()
    if not re.fullmatch(r"[0-9a-f]{6}", hex_code):
        return '<div class="notice error">Invalid aircraft identifier.</div>'
    data, _ = get_aircraft_data()
    aircraft = next((a for a in data.get("aircraft", []) if str(a.get("hex", "")).lower() == hex_code), None)
    if not aircraft:
        return '<div class="notice warning">Aircraft is no longer present in the receiver feed.</div>'
    flight = clean(str(aircraft.get("flight", "")).strip() or "Unknown")
    aircraft_type = clean(aircraft.get("t") or aircraft.get("desc") or "Unknown")
    speed = clean(aircraft.get("gs"))
    altitude = clean(aircraft.get("alt_baro"))
    squawk = clean(aircraft.get("squawk"))
    lat = clean(aircraft.get("lat"))
    lon = clean(aircraft.get("lon"))
    distance = clean(aircraft.get("r_dst"))
    bearing = clean(aircraft.get("r_dir"))
    route = clean(lookup_route(str(aircraft.get("flight", "")).strip()))
    return f'''<section class="detail-card"><div class="detail-heading"><div><p class="eyebrow">AIRCRAFT</p><h2>{flight}</h2></div><span class="badge">{aircraft_type}</span></div><div class="detail-grid"><div><span>ICAO hex</span><strong>{hex_code}</strong></div><div><span>Type</span><strong>{aircraft_type}</strong></div><div><span>Squawk</span><strong>{squawk}</strong></div><div><span>Ground speed</span><strong>{speed} kt</strong></div><div><span>Altitude</span><strong>{altitude} ft</strong></div><div><span>Latitude</span><strong>{lat}</strong></div><div><span>Longitude</span><strong>{lon}</strong></div><div><span>Distance</span><strong>{distance}</strong></div><div><span>Bearing</span><strong>{bearing}</strong></div><div><span>Route</span><strong>{route}</strong></div></div></section>'''
'''
              try:
                  source = replace_function(source, 'detail_fragment', detail_fn)
              except SystemExit:
                  pass

          # Ensure the regex module is available to the hardened detail helper.
          if 'import re\n' not in source and 'import re\r\n' not in source:
              source = source.replace('import os\n', 'import os\nimport re\n', 1)

          path.write_text(source, encoding='utf-8')
          subprocess.run(['python', '-m', 'py_compile', 'webpage.py', 'main.py'], check=True)
          print('Patched webpage.py and passed py_compile')
          PY
          python /tmp/patch_planes.py

      - name: Commit fixes
        run: |
          rm -rf __pycache__
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webpage.py
          git commit -m "Fix dashboard refresh, caching, filters and settings safety"
          git push origin v0.0.5-audit-fixes

      - name: Remove one-shot workflow
        if: always()
        run: |
          git rm -f .github/workflows/audit-fix.yml || true
          git commit -m "Remove one-shot audit workflow" || true
          git push origin v0.0.5-audit-fixes || true
